name: Build WDA for TrollStore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Dependencies
        run: |
          if [ -f "./Scripts/bootstrap.sh" ]; then
            ./Scripts/bootstrap.sh -d
          fi

      - name: Install ldid
        run: brew install ldid

      - name: Build WebDriverAgent
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$(pwd)/build"
          
          echo "Packaging IPA..."
          mkdir -p Payload
          mv build/WebDriverAgentRunner-Runner.app Payload/
          
          echo "Ad-Hoc Signing for AppSync..."
          # Tự động tìm tất cả file thực thi Mach-O và đóng dấu chữ ký giả (ldid)
          find Payload -type f -exec sh -c 'file "$1" | grep -q "Mach-O" && ldid -S "$1"' _ {} \;
          
          zip -r WebDriverAgent.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-IPA
          path: WebDriverAgent.ipa
