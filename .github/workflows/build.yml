name: Build WDA for TrollStore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Dependencies
        run: |
          # Chạy lệnh cài đặt các thư viện phụ trợ của Appium trước khi Build (Nếu có)
          if [ -f "./Scripts/bootstrap.sh" ]; then
            ./Scripts/bootstrap.sh -d
          fi

      - name: Build WebDriverAgent
        run: |
          # Dùng Xcode mặc định của máy chủ để Build
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$(pwd)/build"
          
          # Đóng gói thành file .ipa cho TrollStore
          echo "Packaging IPA..."
          mkdir -p Payload
          mv build/WebDriverAgentRunner-Runner.app Payload/
          zip -r WebDriverAgent.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-IPA
          path: WebDriverAgent.ipa
